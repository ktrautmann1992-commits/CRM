name: Spotpreise abrufen (einmalig)
on:
  push:
    branches: [spotpreise-abruf]
permissions:
  contents: write
jobs:
  abruf:
    runs-on: ubuntu-latest
    steps:
      - name: Strompreise Day-Ahead DE-LU von Energy-Charts
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, datetime as dt
          alle = {}; lizenz = ""
          d = dt.date(2025, 1, 1); ende = dt.date.today() + dt.timedelta(days=2)
          while d < ende:
              n = (d.replace(day=28) + dt.timedelta(days=4)).replace(day=1)
              url = f"https://api.energy-charts.info/price?bzn=DE-LU&start={d}&end={n}"
              for v in range(5):
                  try:
                      with urllib.request.urlopen(url, timeout=60) as r: j = json.load(r); break
                  except Exception as e:
                      print("Fehler", url, e); time.sleep(5 * (v + 1))
              else: raise SystemExit("abgebrochen bei " + url)
              lizenz = j.get("license_info", lizenz)
              for s, p in zip(j["unix_seconds"], j["price"]):
                  if p is not None: alle[s] = p
              print(d, len(j["unix_seconds"])); d = n; time.sleep(3)
          json.dump({"lizenz": lizenz, "reihe": sorted(alle.items())}, open("strom.json", "w"))
          print("Werte:", len(alle))
          PY
      - name: Ergebnis auf den Zweig legen
        run: |
          git init -q && git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git checkout -q -b ergebnis && git add strom.json
          git -c user.name=abruf -c user.email=abruf@localhost commit -q -m "Strompreise"
          git push -q -f origin ergebnis:spotpreise-ergebnis
